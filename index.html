<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="manifest" href="/manifest.json" />
    <title>Base44 APP</title>
    <style>
      /* Prevent flash of unstyled content on refresh */
      html, body { background: #000; margin: 0; color: #fff; }
      #ttt-boot {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.3s ease;
      }
      #ttt-boot.hide { opacity: 0; pointer-events: none; }
      #ttt-boot-logo {
        width: 88px;
        height: 88px;
        position: relative;
        animation: ttt-float 2.4s ease-in-out infinite;
      }
      #ttt-boot-logo svg {
        width: 100%;
        height: 100%;
        animation: ttt-spin 3.2s cubic-bezier(.6,.05,.4,.95) infinite;
        filter: drop-shadow(0 0 18px rgba(73, 234, 200, 0.55));
      }
      #ttt-boot-glow {
        position: absolute;
        inset: -20%;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(73,234,200,0.35) 0%, rgba(73,234,200,0) 65%);
        animation: ttt-pulse 2.4s ease-in-out infinite;
      }
      @keyframes ttt-spin {
        0%   { transform: rotate(0deg); }
        50%  { transform: rotate(180deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes ttt-float {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-6px); }
      }
      @keyframes ttt-pulse {
        0%, 100% { opacity: 0.4; transform: scale(0.9); }
        50%      { opacity: 0.9; transform: scale(1.15); }
      }
    </style>
  </head>
  <body>
    <div id="ttt-boot">
      <div style="display:flex;flex-direction:column;align-items:center;gap:24px;">
        <div id="ttt-boot-logo">
          <div id="ttt-boot-glow"></div>
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="kg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#70F0CC"/>
                <stop offset="100%" stop-color="#26B198"/>
              </linearGradient>
            </defs>
            <circle cx="100" cy="100" r="92" fill="url(#kg)"/>
            <path d="M70 50 L70 150 M70 100 L130 50 M70 100 L130 150" stroke="#0b1b18" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
        <div id="ttt-boot-label" style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:13px;letter-spacing:0.2em;color:rgba(255,255,255,0.5);text-transform:uppercase;">Loading</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Keep boot overlay visible until React actually mounts content into #root.
      // SPECIAL: on the /login route the unstyled page-list flashes briefly before
      // base44's login UI paints. Hold the overlay longer there until a real
      // login form/button is visible.
      (function () {
        var path = window.location.pathname;
        // /login on custom domains (e.g. tttz.xyz/login) is base44's server-rendered
        // login page that briefly shows a raw page list. Keep the boot overlay over it
        // forever — the browser will navigate away to base44.com login UI shortly.
        var isLoginRoute = /^\/login(\/|$)/i.test(path);
        if (isLoginRoute) {
          // Never hide the boot overlay on /login — let the redirect take over.
          // Also nuke whatever is in <body> that's not the boot overlay so the
          // page list doesn't bleed through behind it.
          document.documentElement.style.background = '#000';
          var lbl = document.getElementById('ttt-boot-label');
          if (lbl) lbl.textContent = 'Connecting';
          var observer = new MutationObserver(function () {
            var boot = document.getElementById('ttt-boot');
            if (boot && boot.parentNode) {
              // Re-promote boot to top-most child every time DOM changes.
              if (boot.parentNode.lastElementChild !== boot) {
                boot.parentNode.appendChild(boot);
              }
            }
          });
          if (document.body) {
            observer.observe(document.body, { childList: true, subtree: false });
          } else {
            document.addEventListener('DOMContentLoaded', function () {
              observer.observe(document.body, { childList: true, subtree: false });
            });
          }
          return; // never call hideBoot
        }

        function hideBoot() {
          var b = document.getElementById('ttt-boot');
          if (!b) return;
          b.classList.add('hide');
          setTimeout(function () { b.remove(); }, 350);
        }
        function checkMounted() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            requestAnimationFrame(function () { setTimeout(hideBoot, 100); });
          } else {
            setTimeout(checkMounted, 50);
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', checkMounted);
        } else {
          checkMounted();
        }
        setTimeout(hideBoot, 6000);
      })();
    </script>
  </body>
</html>
