<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="manifest" href="/manifest.json" />
    <title>Base44 APP</title>
    <style>
      /* Prevent flash of unstyled content on refresh */
      html, body { background: #000; margin: 0; color: #fff; }
      #ttt-boot {
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.3s ease;
      }
      #ttt-boot.hide { opacity: 0; pointer-events: none; }
      #ttt-boot::after {
        content: "";
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255,255,255,0.15);
        border-top-color: #06b6d4;
        border-radius: 50%;
        animation: ttt-spin 0.8s linear infinite;
      }
      @keyframes ttt-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="ttt-boot"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Keep boot overlay visible until React actually mounts content into #root
      (function () {
        function hideBoot() {
          var b = document.getElementById('ttt-boot');
          if (!b) return;
          b.classList.add('hide');
          setTimeout(function () { b.remove(); }, 350);
        }
        function checkMounted() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            // Wait one more frame so styles paint before fade
            requestAnimationFrame(function () { setTimeout(hideBoot, 100); });
          } else {
            setTimeout(checkMounted, 50);
          }
        }
        // Start checking after DOM is ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', checkMounted);
        } else {
          checkMounted();
        }
        // Safety: never show boot more than 6s
        setTimeout(hideBoot, 6000);
      })();
    </script>
  </body>
</html>
