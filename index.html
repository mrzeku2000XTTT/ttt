        document.title = LOCKED_TITLE;
        try {
          var titleEl = document.querySelector("title");
          if (titleEl && "MutationObserver" in window) {
            new MutationObserver(function () {
              if (document.title !== LOCKED_TITLE) document.title = LOCKED_TITLE;
            }).observe(titleEl, { childList: true, characterData: true, subtree: true });
          }
          // Re-assert across the entire SEO injection window
          [0, 16, 50, 100, 250, 500, 1000, 2000, 4000].forEach(function (ms) {

              if (document.title !== LOCKED_TITLE) document.title = LOCKED_TITLE;

    <script>
      // Keep boot overlay visible until React actually mounts content into #root.
      // SPECIAL: on the /login route the unstyled page-list flashes briefly before
      // base44's login UI paints. Hold the overlay longer there until a real
      // login form/button is visible.
      (function () {
        // NOTE: /login is now a real in-app page (custom email/password login),
        // so it boots like any other route — no special overlay handling.
        function hideBoot() {
          var b = document.getElementById('ttt-boot');
          if (!b) return;
          b.classList.add('hide');
          setTimeout(function () { b.remove(); }, 350);
        }
        function checkMounted() {
          var root = document.getElementById('root');
          if (root && root.children.length > 0) {
            requestAnimationFrame(function () { setTimeout(hideBoot, 100); });
          } else {
            setTimeout(checkMounted, 50);
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', checkMounted);
        } else {
          checkMounted();
        }
        setTimeout(hideBoot, 6000);
      })();
    </script>
    <script>
      // ─── TTT 3.0 Agent Control Bridge ───
      // When this page is loaded inside the Agent Computer iframe, listen for
      // postMessage commands from the parent and execute them on the DOM.
      // Only responds when the page is iframed (window !== window.top).
      (function () {
        if (window === window.top) return; // only in iframe
        var AGENT_NS = 'ttt-agent';

        function findByText(text, tagFilter) {
          var t = (text || '').toLowerCase().trim();
          if (!t) return null;
          var els = document.querySelectorAll(tagFilter || 'button, a, [role="button"], [data-agent-id]');
          var visMatches = [];
          var hiddenMatches = [];
          var aidMatch = null;
          for (var i = 0; i < els.length; i++) {
            var el = els[i];
            var aid = (el.getAttribute('data-agent-id') || '').toLowerCase().trim();
            var txt = (el.innerText || el.textContent || el.getAttribute('aria-label') || el.getAttribute('title') || '').toLowerCase().trim();
            var matches = false;
            // Exact data-agent-id match wins outright
            if (aid === t) { aidMatch = el; break; }
            // Otherwise: match aid contains, or text equals/contains
            if (aid && aid.indexOf(t) !== -1) matches = true;
            else if (txt === t || txt.indexOf(t) !== -1) matches = true;
            if (!matches) continue;
            var r = el.getBoundingClientRect();
            var visible = el.offsetParent !== null && r.width > 0 && r.height > 0 && r.bottom > 0 && r.top < window.innerHeight;
            if (visible) visMatches.push(el);
            else hiddenMatches.push(el);
          }
          return aidMatch || visMatches[0] || hiddenMatches[0] || null;
        }

        function findInput(label) {
          var l = (label || '').toLowerCase().trim();
          // Exact match first: placeholder, name, aria-label, data-agent-id
          var inputs = document.querySelectorAll('input, textarea, [contenteditable="true"]');
          for (var i = 0; i < inputs.length; i++) {
            var el = inputs[i];
            var attrs = [el.getAttribute('placeholder'), el.getAttribute('name'), el.getAttribute('aria-label'), el.getAttribute('data-agent-id')];
            for (var j = 0; j < attrs.length; j++) {
              if (attrs[j] && attrs[j].toLowerCase().indexOf(l) !== -1) return el;
            }
          }
          // Fallback: first visible input/textarea
          for (var k = 0; k < inputs.length; k++) {
            if (inputs[k].offsetParent !== null) return inputs[k];
          }
          return null;
        }

        function getRect(el) {
          var r = el.getBoundingClientRect();
          var vw = window.innerWidth, vh = window.innerHeight;
          return {
            x: ((r.left + r.width / 2) / vw) * 100,
            y: ((r.top + r.height / 2) / vh) * 100,
            visible: r.top >= 0 && r.bottom <= vh,
          };
        }

        function setReactInputValue(el, value) {
          var proto = el.tagName === 'TEXTAREA' ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
          var setter = Object.getOwnPropertyDescriptor(proto, 'value').set;
          setter.call(el, value);
          el.dispatchEvent(new Event('input', { bubbles: true }));
          el.dispatchEvent(new Event('change', { bubbles: true }));
        }

        function reply(id, payload) {
          window.parent.postMessage({ ns: AGENT_NS, type: 'response', id: id, payload: payload }, '*');
        }

        window.addEventListener('message', function (e) {
          var msg = e.data;
          if (!msg || msg.ns !== AGENT_NS || msg.type !== 'command') return;
          var cmd = msg.command;
          var id = msg.id;
          try {
            if (cmd.action === 'click_text') {
              var btn = findByText(cmd.text, cmd.tagFilter);
              if (!btn) return reply(id, { ok: false, error: 'not_found' });
              btn.scrollIntoView({ block: 'center', behavior: 'smooth' });
              var pos = getRect(btn);
              setTimeout(function () { btn.click(); reply(id, { ok: true, position: pos }); }, 400);
            } else if (cmd.action === 'locate') {
              var el = findByText(cmd.text, cmd.tagFilter);
              if (!el) return reply(id, { ok: false, error: 'not_found' });
              el.scrollIntoView({ block: 'center', behavior: 'smooth' });
              setTimeout(function () { reply(id, { ok: true, position: getRect(el) }); }, 250);
            } else if (cmd.action === 'locate_input') {
              var inEl = findInput(cmd.label);
              if (!inEl) return reply(id, { ok: false, error: 'input_not_found' });
              inEl.scrollIntoView({ block: 'center', behavior: 'smooth' });
              setTimeout(function () { reply(id, { ok: true, position: getRect(inEl) }); }, 250);
            } else if (cmd.action === 'type_into') {
              var input = findInput(cmd.label);
              if (!input) return reply(id, { ok: false, error: 'input_not_found' });
              input.scrollIntoView({ block: 'center', behavior: 'smooth' });
              setTimeout(function () {
                input.focus();
                var pos = getRect(input);
                var fullText = cmd.text || '';
                var charDelay = cmd.charDelay || 60;

                if (input.isContentEditable) {
                  // Stream into contenteditable
                  var i = 0;
                  input.textContent = '';
                  var typeNext = function () {
                    if (i >= fullText.length) {
                      reply(id, { ok: true, position: pos });
                      return;
                    }
                    input.textContent = fullText.slice(0, i + 1);
                    input.dispatchEvent(new InputEvent('input', { bubbles: true }));
                    i++;
                    setTimeout(typeNext, charDelay);
                  };
                  typeNext();
                } else {
                  // Stream into native input — set value char by char so user sees it grow
                  var j = 0;
                  setReactInputValue(input, '');
                  var typeNextNative = function () {
                    if (j >= fullText.length) {
                      reply(id, { ok: true, position: pos });
                      return;
                    }
                    setReactInputValue(input, fullText.slice(0, j + 1));
                    j++;
                    setTimeout(typeNextNative, charDelay);
                  };
                  typeNextNative();
                }
              }, 350);
            } else if (cmd.action === 'scroll') {
              window.scrollTo({ top: (cmd.y || 0), behavior: 'smooth' });
              reply(id, { ok: true });
            } else if (cmd.action === 'read_page') {
              var headings = Array.from(document.querySelectorAll('h1, h2, h3, [role="heading"]')).slice(0, 10).map(function (h) { return h.innerText.trim(); }).filter(Boolean);
              // Collect all interactive elements, then prioritize: 1) data-agent-id, 2) visible in viewport
              var allBtns = Array.from(document.querySelectorAll('button, a[href], [role="button"], [data-agent-id]'));
              var isVisible = function (el) {
                if (!el || el.offsetParent === null) return false;
                var r = el.getBoundingClientRect();
                return r.width > 0 && r.height > 0 && r.bottom > 0 && r.top < window.innerHeight;
              };
              var withMeta = allBtns.map(function (b) {
                var aid = b.getAttribute('data-agent-id');
                var label = (b.innerText || b.getAttribute('aria-label') || b.getAttribute('title') || '').trim();
                if (!aid && !label) return null;
                return {
                  el: b,
                  aid: aid,
                  label: label,
                  visible: isVisible(b),
                  hasAid: !!aid,
                };
              }).filter(Boolean);
              // Sort: data-agent-id first, then visible, preserving DOM order within groups
              withMeta.sort(function (a, b) {
                if (a.hasAid !== b.hasAid) return a.hasAid ? -1 : 1;
                if (a.visible !== b.visible) return a.visible ? -1 : 1;
                return 0;
              });
              var buttons = withMeta.slice(0, 40).map(function (m) {
                return m.aid ? (m.label ? m.label + ' [#' + m.aid + ']' : '#' + m.aid) : m.label;
              });
              var inputs = Array.from(document.querySelectorAll('input, textarea, [contenteditable="true"]')).slice(0, 20).map(function (i) {
                var label = i.getAttribute('data-agent-id') || i.getAttribute('aria-label') || i.getAttribute('name') || i.getAttribute('placeholder') || '';
                var type = i.tagName.toLowerCase() + (i.type ? ':' + i.type : '');
                var val = i.isContentEditable ? (i.textContent || '') : (i.value || '');
                val = String(val).trim().slice(0, 80);
                if (!label && !val) return null;
                var base = label ? (label + ' (' + type + ')') : ('(' + type + ')');
                return val ? (base + ' = "' + val + '"') : base;
              }).filter(Boolean);
              reply(id, { ok: true, title: document.title, url: location.pathname, headings: headings, buttons: buttons.slice(0, 30), inputs: inputs });
            } else if (cmd.action === 'ping') {
              reply(id, { ok: true, ready: true, url: location.pathname });
            } else {
              reply(id, { ok: false, error: 'unknown_action' });
            }
          } catch (err) {
            reply(id, { ok: false, error: String(err.message || err) });
          }
        });

        // Announce ready
        setTimeout(function () {
          window.parent.postMessage({ ns: AGENT_NS, type: 'ready', url: location.pathname }, '*');
        }, 100);
      })();
    </script>
